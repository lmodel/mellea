---
name: Deploy docs
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build-docs:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pyversion: ["3.14"]

    # mkdocs gh-deploy pushes to the gh-pages branch via git; only contents
    # write is required. Pages/OIDC permissions are unused here.
    permissions:
      contents: write

    defaults:
      run:
        working-directory: linkml

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0  # uv-dynamic-versioning reads git tags

      - name: Configure git for the bot
        # Gives the bot that commits to gh-pages a name & email address
        # so that the commits have an author in the commit log.
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.pyversion }}
          enable-cache: true
          # action inputs are not affected by defaults.run.working-directory
          cache-dependency-glob: "linkml/uv.lock"

      - name: Install just
        run: uv tool install rust-just

      - name: Install dependencies
        run: uv sync --group dev --no-progress

      - name: Generate schema documentation
        run: just gen-doc

      - name: Deploy to GitHub Pages
        run: uv run mkdocs gh-deploy --force
